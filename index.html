<head>
<meta charset="utf-8">

<title>Gerar Link de Aceite · Instituto Garcia Marques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1730;--gold:#c9a24a;--paper:#f6f4ee;--card:#fff;--ink:#1b2236;--muted:#6b7488;--line:#e3dfd3}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2{font-family:'Cormorant Garamond',serif;color:var(--navy);margin:.1em 0 .4em}
h1{font-size:2rem}h2{font-size:1.3rem}
.top{background:#000;color:#fff;padding:12px 16px}
.top div{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}.logo{height:46px;width:auto;display:block}.tag{color:var(--gold);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px;font-weight:500}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfcab9;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:11px 18px;cursor:pointer;font:600 .92rem Inter}
.btn.gold{background:var(--gold);color:#1a1405}
.out{width:100%;min-height:90px;padding:10px;border:1px dashed #cfcab9;border-radius:7px;font:.82rem ui-monospace,Menlo,monospace;background:#fffdf8;word-break:break-all;white-space:pre-wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--muted);font-size:.85rem}
</style>
</head>

<div class="wrap">
<h1>Gerar link de aceite</h1>
<p class="muted">Preencha os dados da venda. O link leva o serviço, o valor e as condições já preenchidos. O cliente confere os dados da empresa, lê o contrato e aceita. O aceite fica registrado automaticamente.</p>

<div class="card"><h2>Venda</h2><div class="grid">
  <div><label for="vendedor">Vendedor</label><input id="vendedor" type="text"></div>
  <div><label for="empresa">Empresa (opcional)</label><input id="empresa" type="text"></div>
  <div><label for="servico">Serviço</label><select id="servico">
    <option value="drps">DRPS (diagnóstico)</option>
    <option value="pcpsm">PCPSM (programa contínuo, 12 meses)</option>
    <option value="completo">DRPS + PCPSM (completo)</option></select></div>
  <div><label for="faixa">Faixa de colaboradores</label><select id="faixa"></select></div>
  <div><label for="valor">Valor (R$)</label><input id="valor" type="number" min="1" step="0.01"></div>
  <div><label for="forma">Forma de pagamento</label><select id="forma">
    <option value="boleto">Boleto bancário</option>
    <option value="cartao">Cartão de crédito</option>
    <option value="transferencia">Transferência / Pix</option>
    <option value="outro">Outro (negociação personalizada)</option></select></div>
  <div class="padrao"><label for="entrada">Entrada (R$, opcional)</label><input id="entrada" type="number" min="0" step="0.01" placeholder="0,00"></div>
  <div class="padrao"><label for="parcelas">Parcelas (sobre o saldo)</label><select id="parcelas"></select></div>
  <div class="padrao" id="wdia"><label for="dia">Dia do vencimento</label><input id="dia" type="number" min="1" max="28" value="10"></div>
  <div class="padrao" id="wprim"><label for="primeira">1ª parcela vence em (opcional)</label><input id="primeira" type="text" placeholder="ex.: 10/12/2026"></div>
  <div class="full" id="wcond" hidden><label for="condicoes">Condições negociadas (aparecem no contrato exatamente como escrito)</label><textarea id="condicoes" rows="3" placeholder="ex.: Entrada de R$ 2.000,00 em 05/12/2026, mais 4 parcelas de R$ 1.975,00 em boleto, vencendo todo dia 10 a partir de 10/01/2027."></textarea></div>
  <div class="full"><label>Como ficará no contrato (cláusula 3.1)</label><div class="out" id="prev" style="min-height:0"></div></div>
  <div><label for="coleta">Prazo da coleta (dias)</label><input id="coleta" type="number" min="1" value="15"></div>
  <div><label for="relatorio">Entrega do relatório (dias úteis)</label><input id="relatorio" type="number" min="1" value="10"></div>
  <div class="full"><label for="base">Endereço da página de aceite</label><input id="base" type="text"></div>
</div></div>

<div class="card"><h2>Link e mensagem</h2>
  <label for="link">Link do cliente</label><div class="out" id="link"></div>
  <div class="actions"><button class="btn gold" id="cp1">Copiar link</button></div>
  <label for="msg" style="margin-top:14px">Mensagem para o WhatsApp</label><div class="out" id="msg"></div>
  <div class="actions"><button class="btn" id="cp2">Copiar mensagem</button></div>
</div>
</div>
<script>
const PRECOS = [
  {f:'Até 10',      drps:2200,  pcpsm:2700,  tot:4900},
  {f:'11 a 50',     drps:4500,  pcpsm:5400,  tot:9900},
  {f:'51 a 100',    drps:8000,  pcpsm:9900,  tot:17900},
  {f:'101 a 250',   drps:15500, pcpsm:19400, tot:34900},
  {f:'251 a 500',   drps:27000, pcpsm:32900, tot:59900},
  {f:'Mais de 500', drps:0,     pcpsm:0,     tot:0}
];
const $ = s => document.querySelector(s);
$('#faixa').innerHTML = PRECOS.map((p,i)=>`<option value="${i}">${p.f}</option>`).join('');
$('#parcelas').innerHTML = [1,2,3,4,5,6,8,10,12].map(n=>`<option value="${n}">${n===1?'À vista':n+'x'}</option>`).join('');
$('#base').value = new URL('aceite.html', location.href).href;
/* ===== Valor por extenso ===== */
function extenso(n){
  const u=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=x=>{ if(x===100)return'cem'; const r=[]; if(x>=100)r.push(c[Math.floor(x/100)]); const y=x%100;
    if(y>0){ if(y<20)r.push(u[y]); else{ r.push(d[Math.floor(y/10)]+(y%10?' e '+u[y%10]:'')) } } return r.join(' e '); };
  const reais=Math.floor(n), cent=Math.round((n-reais)*100);
  let t=''; const mil=Math.floor(reais/1000), resto=reais%1000;
  if(mil>0) t+=(mil===1?'mil':ate999(mil)+' mil');
  if(resto>0) t+=(t?(resto<100||resto%100===0?' e ':', '):'')+ate999(resto);
  if(!t) t='zero';
  let out=t+(reais===1?' real':' reais');
  if(cent>0) out+=' e '+ate999(cent)+(cent===1?' centavo':' centavos');
  return out;
}
const brl = n => 'R$ ' + Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ===== Forma de pagamento (usada no contrato e no resumo) ===== */
const FORMAS = {boleto:'Boleto', cartao:'Cartão de crédito', transferencia:'Transferência / Pix', outro:'Condição negociada'};
function pagto(L){
  const valor = Number(L.valor), forma = L.forma || 'boleto';
  if(forma==='outro' && String(L.condicoes||'').trim()){
    const c = String(L.condicoes).trim();
    return {frase:`conforme as condições negociadas entre as Partes: ${c.replace(/[.\s]+$/,'')}`, rotulo:c};
  }
  const meio = {boleto:'por boleto bancário', cartao:'no cartão de crédito, por link de pagamento enviado pela CONTRATADA', transferencia:'por transferência bancária ou Pix'}[forma] || 'por boleto bancário';
  const ent = Math.min(Number(L.entrada)||0, valor), n = Math.max(1, Number(L.parcelas)||1), saldo = valor - ent;
  const nTxt = k => `${k} (${extenso(k).replace(' reais','')})`;
  const venc = forma==='cartao' ? '' : `, com vencimento todo dia ${L.dia||10} de cada mês${L.primeira?`, vencendo a primeira em ${L.primeira}`:''}`;
  let frase, rotulo;
  if(ent>0 && saldo>0){
    const resto = n>1 ? `em ${nTxt(n)} parcelas mensais, iguais e sucessivas de ${brl(saldo/n)}${venc}` : `em parcela única${forma==='cartao'?'':(L.primeira?`, com vencimento em ${L.primeira}`:'')}`;
    frase = `${meio}, em entrada de ${brl(ent)} no ato da assinatura e saldo de ${brl(saldo)} ${resto}`;
    rotulo = `${FORMAS[forma]} · entrada ${brl(ent)} + ${n>1?n+'x de '+brl(saldo/n):brl(saldo)}`;
  }else if(n>1){
    frase = `${meio}, em ${nTxt(n)} parcelas mensais, iguais e sucessivas de ${brl(valor/n)}${venc}`;
    rotulo = `${FORMAS[forma]} · ${n}x de ${brl(valor/n)}`;
  }else{
    frase = `${meio}, à vista, em parcela única, no ato da assinatura deste contrato`;
    rotulo = `${FORMAS[forma]} · à vista`;
  }
  return {frase, rotulo};
}

const nomes = {drps:'Diagnóstico de Riscos Psicossociais (DRPS)', pcpsm:'Programa de Controle e Promoção da Saúde Mental (PCPSM)', completo:'DRPS + PCPSM'};

function sugere(){
  const p = PRECOS[$('#faixa').value], k = {drps:'drps',pcpsm:'pcpsm',completo:'tot'}[$('#servico').value];
  $('#valor').value = p[k] || '';
  gera();
}
function gera(){
  const p = PRECOS[$('#faixa').value], v = Number($('#valor').value);
  const outro = $('#forma').value==='outro';
  $('#wcond').hidden = !outro; document.querySelectorAll('.padrao').forEach(e=>e.hidden = outro);
  if(!outro){ const cartao=$('#forma').value==='cartao'; $('#wdia').hidden=cartao; $('#wprim').hidden=cartao; }
  if(outro && !$('#condicoes').value.trim()){ $('#prev').textContent='Escreva as condições negociadas.'; $('#link').textContent='Escreva as condições negociadas para gerar o link.'; $('#msg').textContent=''; return; }
  if(Number($('#entrada').value)>=v && !outro){ $('#prev').textContent='A entrada deve ser menor que o valor total.'; $('#link').textContent='Corrija a entrada para gerar o link.'; $('#msg').textContent=''; return; }
  if(!(v>0)){ $('#link').textContent='Informe o valor para gerar o link.'; $('#msg').textContent=''; return; }
  const d = {servico:$('#servico').value, faixa:p.f, valor:v, forma:$('#forma').value, entrada:Number($('#entrada').value)||0, condicoes:$('#condicoes').value.trim(),
    parcelas:Number($('#parcelas').value), dia:Number($('#dia').value)||10, primeira:$('#primeira').value.trim(), coleta:Number($('#coleta').value)||15, relatorio:Number($('#relatorio').value)||10,
    vendedor:$('#vendedor').value.trim()};
  if($('#empresa').value.trim()) d.empresa = $('#empresa').value.trim();
  $('#prev').textContent = `O valor total do serviço é de ${brl(v)} (${extenso(v)}), a ser pago ${pagto(d).frase}.`;
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const url = $('#base').value.split('?')[0] + '?d=' + b64;
  $('#link').textContent = url;
  $('#msg').textContent = `Olá${d.empresa?', pessoal da '+d.empresa:''}! Segue o contrato do ${nomes[d.servico]} (${p.f} colaboradores, ${brl(v)}).\n\nÉ só abrir o link, conferir os dados da empresa, ler e aceitar. Leva 2 minutos e o aceite fica registrado:\n${url}\n\nApós o aceite, enviamos os dados de pagamento e liberamos seu acesso à plataforma.`;
}
async function copia(id, btn){
  const t = $(id).textContent, o = btn.textContent;
  try{ await navigator.clipboard.writeText(t); btn.textContent='Copiado'; }
  catch(e){ const r=document.createRange(); r.selectNodeContents($(id)); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent='Selecionado, use Ctrl+C'; }
  setTimeout(()=>btn.textContent=o,1800);
}
['servico','faixa'].forEach(i=>$('#'+i).addEventListener('change',sugere));
['vendedor','empresa','valor','parcelas','dia','primeira','coleta','relatorio','base','forma','entrada','condicoes'].forEach(i=>$('#'+i).addEventListener('input',gera));
$('#cp1').onclick=e=>copia('#link',e.target); $('#cp2').onclick=e=>copia('#msg',e.target);
sugere();
</script>
</body>
</html>
